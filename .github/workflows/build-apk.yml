name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk IPTV-Rot-Weiss.apk

      # Immer neueste Version unter "Releases" → direkt am Handy herunterladbar
      - name: Release "Neueste Version" aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version
          body: "Automatisch gebaut aus Commit ${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: IPTV-Rot-Weiss.apk
